name: macOS build

on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Xcode 26 has the macOS 26 SDK, which live transcription needs for SpeechAnalyzer; without it the app still
          # builds, with SFSpeechRecognizer only.
          latest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build app
        run: ./Scripts/build-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingYiTranslator-mac
          path: mac/build/QingYiTranslator-mac.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/QingYiTranslator-mac.zip --clobber
